<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Like Snooker Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;700;800&display=swap">
<style>
:root{--bg:#fff8de;--card:#fff;--tx:#1b1b1b;--mut:#6f6a58;--bd:#1b1b1b;--soft:#f1ead0;--y:#ffd21f;--yd:#f2b900;--bl:#2f7fd1;--or:#f08a00;--rd:#e23b2e;--gr:#1f9d55;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Prompt","Noto Sans Thai",system-ui,-apple-system,sans-serif}
body{background:radial-gradient(circle at 20% -10%,#ffe98a 0,transparent 45%),radial-gradient(circle at 100% 10%,#cfe6ff 0,transparent 40%),var(--bg);min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:12px 12px 96px}
.hero{background:#fff;border:3px solid var(--bd);border-radius:22px;box-shadow:0 5px 0 var(--bd);padding:8px 12px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero img{height:62px;max-width:60%;object-fit:contain}
.tot{text-align:right;font-size:12px;color:var(--mut);font-weight:500}.tot b{display:block;font-size:22px;color:var(--tx);font-weight:800;background:var(--y);border:2px solid var(--bd);border-radius:12px;padding:0 10px;margin-top:2px}
.demo{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut);margin-bottom:12px;flex-wrap:wrap}
.demo button{padding:5px 12px;border-radius:99px;border:2px solid var(--bd);background:#fff;color:var(--tx);font:700 12px "Prompt",sans-serif}
.demo button.on{background:var(--bl);color:#fff}
.card{background:var(--card);border:3px solid var(--bd);border-radius:22px;box-shadow:0 5px 0 var(--bd);padding:14px;margin-bottom:16px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:8px;background:var(--soft)}
.card.s-playing:before{background:var(--gr)}.card.s-paused:before{background:var(--rd)}.card.s-billing:before{background:var(--bl)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.nm{font-weight:800;font-size:19px}
.chip{font-size:12px;padding:3px 12px;border-radius:99px;font-weight:700;border:2px solid var(--bd)}
.free{background:var(--soft);color:var(--mut)}.playing{background:var(--y);color:var(--tx)}.paused{background:var(--rd);color:#fff}.billing{background:var(--bl);color:#fff}
.time{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;margin:6px 0 2px}
.sub{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;align-items:center}
.sub b{color:var(--tx);font-size:19px;font-weight:800}
.rate{font-weight:700;padding:1px 8px;border-radius:8px;color:#fff}.rate.ac{background:var(--bl)}.rate.non{background:var(--or)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button.b{padding:13px 8px;border-radius:14px;border:2px solid var(--bd);font:700 15px/1.25 "Prompt",sans-serif;background:#fff;color:var(--tx);box-shadow:0 3px 0 var(--bd);transition:transform .08s,box-shadow .08s}
button.b:active{transform:translateY(3px);box-shadow:0 0 0 var(--bd)}
button.b small{font-weight:500;font-size:12px}
button.b.w{grid-column:1/-1}button.b.p{background:var(--y)}button.b.d{background:var(--rd);color:#fff}button.b.a{background:var(--bl);color:#fff}button.b.n{background:var(--or);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;max-width:480px;margin:0 auto;background:#fff;border-top:3px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px;border:0;background:none;font:700 15px "Prompt",sans-serif;color:var(--mut)}
nav button.on{color:var(--tx);background:var(--y)}
.ov{position:fixed;inset:0;background:rgba(27,27,27,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.show{display:flex}
.sheet{background:#fff;width:100%;max-width:480px;max-height:90%;overflow:auto;border:3px solid var(--bd);border-bottom:0;border-radius:24px 24px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin:0 0 10px;font-size:19px;font-weight:800}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pg button{padding:14px 8px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:700 15px "Prompt",sans-serif;position:relative;box-shadow:0 3px 0 var(--bd)}
.pg button small{display:block;color:var(--mut);font-weight:500}
.pg .q{position:absolute;top:-8px;right:-6px;background:var(--rd);color:#fff;border:2px solid var(--bd);border-radius:99px;min-width:24px;height:24px;font-size:12px;line-height:20px}
.ln{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;border-bottom:2px dotted #cfc7a8}
.ln span:first-child{color:var(--mut)}
.big{display:flex;justify-content:space-between;font-size:26px;font-weight:800;margin:12px 0;background:var(--y);border:2px solid var(--bd);border-radius:14px;padding:6px 12px}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pay button{padding:11px 4px;border-radius:12px;border:2px solid var(--bd);background:#fff;color:var(--tx);font:700 15px "Prompt",sans-serif}
.pay button.on{background:var(--bl);color:#fff;box-shadow:0 3px 0 var(--bd)}
.qrw{text-align:center;margin:8px 0}.qrw svg{width:200px;height:200px;background:#fff;padding:8px;border-radius:14px;border:3px solid var(--bd)}
.qrw p{margin:6px 0;color:var(--mut);font-size:12px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat div{background:#fff;border:3px solid var(--bd);border-radius:16px;padding:10px 12px;font-size:12px;color:var(--mut);box-shadow:0 4px 0 var(--bd)}
.stat div:nth-child(3){background:var(--y);color:var(--tx)}
.stat b{display:block;font-size:24px;color:var(--tx);font-weight:800}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.foot{text-align:center;font-size:12px;color:var(--mut);margin-top:6px}

.lbl{font-size:12px;color:var(--mut);margin-top:10px;font-weight:500}
.time{margin-top:0}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,select{width:100%;padding:11px 12px;border:2px solid var(--bd);border-radius:12px;font:600 16px "Prompt",sans-serif;background:#fff;color:var(--tx)}
.two2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pay.two{grid-template-columns:1fr 1fr}.pay.two button small{font-weight:500}
.hint{font-size:12px;color:var(--mut);margin:10px 0 0}
.bk{text-align:center;background:var(--bg);border:2px dashed var(--bd);border-radius:14px;padding:12px;margin:8px 0;line-height:1.6}.bk span{font-size:20px;font-weight:800}
.tot span{display:block}
.wh{display:flex;justify-content:center;align-items:center;gap:10px;margin:6px 0}
.wl{text-align:center;font-size:12px;color:var(--mut);margin-bottom:4px;font-weight:600}
.wp{position:relative;width:100px}
.wp:after{content:"";position:absolute;left:0;right:0;top:50px;height:50px;border-top:3px solid var(--yd);border-bottom:3px solid var(--yd);background:rgba(255,210,31,.18);pointer-events:none;border-radius:10px}
.wc{height:150px;overflow-y:auto;scroll-snap-type:y mandatory;border-radius:14px;background:#fff;border:2px solid var(--bd);scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.wc::-webkit-scrollbar{display:none}
.wc div{height:50px;line-height:50px;text-align:center;font-size:24px;font-weight:700;color:#bdb591;scroll-snap-align:center;font-variant-numeric:tabular-nums;cursor:pointer}
.wc div.pad{pointer-events:none;scroll-snap-align:none}
.wc div.on{color:var(--tx);font-size:30px}
.col{font-size:30px;font-weight:800;margin-top:18px}
.acc{width:100%;display:flex;justify-content:space-between;padding:14px 16px;border:3px solid var(--bd);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--bd);font:700 15px "Prompt",sans-serif;color:var(--tx);margin-bottom:14px}
@media (min-width:640px){
.app{max-width:960px;padding:18px 24px 100px}
nav{max-width:960px}
.hero img{height:78px}
#tbl{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
#tbl .card{margin-bottom:0}
#v2:not([hidden]){display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
#v2 .card{margin-bottom:0}
#v2 .stat,#v2 .acc,#v2 .empty{grid-column:1/-1}
#v2 .acc{margin-bottom:0}
.stat{grid-template-columns:repeat(4,1fr)}
.cols{column-count:2;column-gap:32px}.cols .ln{break-inside:avoid}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.fg+.btns{max-width:420px;margin-left:auto}
}
@media (min-width:1024px){
.app{max-width:1200px;padding-top:84px}
#tbl{grid-template-columns:repeat(3,1fr)}
#v2:not([hidden]){grid-template-columns:repeat(3,1fr)}
.time{font-size:56px}
nav{top:0;bottom:auto;max-width:none;justify-content:center;border-top:0;border-bottom:3px solid var(--bd);padding-top:env(safe-area-inset-top,0px);padding-bottom:0}
nav button{flex:0 0 auto;padding:14px 44px}
.ov{align-items:center}
.sheet{border-radius:24px;border-bottom:3px solid var(--bd);max-width:520px;max-height:88%}
}
.gate{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:20px}
.av{border-radius:50%;object-fit:cover;border:2px solid var(--bd);display:inline-flex;align-items:center;justify-content:center;flex:none}.av.ph{background:var(--y);font-weight:800;color:var(--tx)}
.prow{display:flex;align-items:center;gap:12px}.prow input[type=file]{border:0;padding:6px 0;font-size:13px;width:auto}
.lnk{text-align:center;font-size:14px;margin:14px 0 0}.lnk a{color:var(--bl);font-weight:700;cursor:pointer}
.mem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dotted #cfc7a8}.mi{flex:1;min-width:0;display:flex;flex-direction:column}.mi small{color:var(--mut);overflow:hidden;text-overflow:ellipsis}.mem select{width:auto;padding:8px;font-size:14px}
#v3 .card{margin-bottom:16px}
</style>
</head>

<script>
const S={shop:'Like Snooker Club',rAc:120,rNon:60,mode:'baht',min:0,pp:'',bank:'',an:'',ac:'',pin:''};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rl={ac:'เปิดแอร์',non:'ไม่เปิดแอร์'},M=60000;
const rp=r=>r==='ac'?S.rAc:S.rNon;
let T=[],hist=[];
let method='cash',sr='non',dirty=false,unlocked=false,view=1;
const f2=n=>String(n).padStart(2,'0');
const hm=ms=>{const d=new Date(ms);return f2(d.getHours())+':'+f2(d.getMinutes())};
const hms=ms=>{const s=Math.floor(ms/1000);return f2(Math.floor(s/3600))+':'+f2(Math.floor(s/60)%60)+':'+f2(s%60)};
function calc(t,end){const ms=Math.max(0,end-t.s),step=S.mode==='baht'?0:+S.mode;let m=ms/M;if(step)m=Math.ceil(m/step)*step;let a=Math.round(m/60*t.p);if(S.min>0)a=Math.max(a,S.min);return{ms,m,a}}
function card(t){const a=t.st!=='free',wt=t.st==='playing'&&Date.now()<t.s,c=a?calc(t,t.st==='billing'?t.e:Date.now()):null;
 const b=t.st==='free'?`<button class="b p w" onclick="op(${t.id})">เปิดโต๊ะ</button>`:t.st==='playing'?(wt?`<button class="b w" onclick="cx(${t.id})">ยกเลิกการเปิดโต๊ะ</button>`:`<button class="b d w" onclick="co(${t.id})">เช็คบิล</button>`):`<button class="b a w" onclick="bill(${t.id})">เปิดบิล / รับชำระ</button>`;
 const body=a?`<div class="sub"><span>เริ่ม <b>${hm(t.s)}</b>${t.st==='billing'?' · จบ <b>'+hm(t.e)+'</b>':''}</span><span class="rate ${t.r}">${rl[t.r]}${adm()?' '+t.p+'฿/ชม.':''}</span></div><div class="lbl">${t.st==='billing'?'เวลาที่เล่น':wt?'เริ่มนับในอีก':'เล่นมาแล้ว'}</div><div class="time"${wt?' style="color:var(--rd)"':''}>${wt?'-'+hms(Math.ceil((t.s-Date.now())/1000)*1000):hms(c.ms)}</div>${adm()?`<div class="sub"><span>ค่าโต๊ะ${t.st==='billing'?'':' ตอนนี้'}</span><b>${c.a}฿</b></div>`:''}`:`<div class="lbl">&nbsp;</div><div class="time" style="color:var(--mut)">--:--:--</div><div class="sub"><span>พร้อมใช้งาน</span></div>`;
 return `<div class="card s-${t.st}"><div class="row"><span class="nm">โต๊ะ ${t.id}</span><span class="chip ${t.st}">${wt?'รอเริ่ม':{free:'ว่าง',playing:'กำลังเล่น',billing:'รอชำระ'}[t.st]}</span></div>${body}${adm()?`<div class="btns">${b}</div>`:''}</div>`}
function hdr(){const d=new Date(),p=T.filter(t=>t.st!=='free').length;$('dt').textContent=d.toLocaleDateString('th-TH',{weekday:'short',day:'numeric',month:'short'});$('clk').textContent=f2(d.getHours())+':'+f2(d.getMinutes());$('hs').textContent='เล่น '+p+' · ว่าง '+(T.length-p)}
function draw(){$('tbl').innerHTML=T.map(card).join('');hdr()}
const ov=$('ov'),sh=$('sh');
const show=h=>{sh.innerHTML=h;ov.classList.add('show')};
ov.onclick=e=>{if(e.target===ov)ov.classList.remove('show')};
const W={s:false,e:false};
function wheel(id,n,v){let h=`<div class="wp"><div class="wc" id="${id}" data-v="${v}" data-n="${n}"><div class="pad"></div>`;for(let k=0;k<n;k++)h+=`<div data-k="${k}">${f2(k)}</div>`;return h+'<div class="pad"></div></div></div>'}
function wInit(id,key,cb){const el=$(id);const mark=()=>{const v=Math.max(0,Math.min(+el.dataset.n-1,Math.round(el.scrollTop/50)));el.dataset.v=v;[...el.children].forEach(c=>c.classList.toggle('on',c.dataset.k==v))};
 ['pointerdown','wheel','touchstart'].forEach(ev=>el.addEventListener(ev,()=>{W[key]=true},{passive:true}));
 el.addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k!==undefined){W[key]=true;el.scrollTo({top:k*50,behavior:'smooth'})}});
 el.scrollTop=+el.dataset.v*50;mark();el.addEventListener('scroll',()=>{mark();cb()})}
const wp2=(p,d)=>`<div class="wh"><div><div class="wl">ชั่วโมง</div>${wheel(p+'_h',24,d.getHours())}</div><span class="col">:</span><div><div class="wl">นาที</div>${wheel(p+'_m',60,d.getMinutes())}</div></div>`;
const pickT=(p,base)=>{const d=new Date(base);d.setHours(+$(p+'_h').dataset.v,+$(p+'_m').dataset.v,0,0);return d.getTime()};
function op(i){sr='ac';W.s=false;
 show(`<h2>เปิดโต๊ะ ${i}</h2><label>เลือกเรท</label><div class="pay two"><button id="r_ac" class="on" onclick="pr('ac')">เปิดแอร์<br><small>${S.rAc}฿/ชม.</small></button><button id="r_non" onclick="pr('non')">ไม่เปิดแอร์<br><small>${S.rNon}฿/ชม.</small></button></div><label>เวลาเริ่ม (เลื่อนเลือก ค่าเริ่มต้น = ตอนนี้)</label>${wp2('ws',new Date())}<button class="b p w" style="width:100%;margin-top:14px" onclick="go(${i})">เริ่มจับเวลา</button>`);
 ['ws_h','ws_m'].forEach(k=>wInit(k,'s',()=>{}))}
const pr=r=>{sr=r;['ac','non'].forEach(k=>$('r_'+k).classList.toggle('on',k===r))};
function endT(t){if(!W.e)return Date.now();let e=pickT('we',t.s);if(e<t.s)e+=864e5;return e}
function co(i){const t=T[i-1];W.e=false;
 show(`<h2>เช็คบิล โต๊ะ ${i}</h2><div class="ln"><span>เริ่ม</span><b>${hm(t.s)}</b></div><label>เวลาสิ้นสุด (เลื่อนเลือก ค่าเริ่มต้น = ตอนนี้)</label>${wp2('we',new Date())}<div class="ln"><span>ระยะเวลา</span><b id="ed"></b></div><div class="ln"><span>ค่าโต๊ะ</span><b id="ea"></b></div><p class="hint" id="ew"></p><button class="b d w" style="width:100%;margin-top:12px" onclick="cfm(${i})">ยืนยัน ไปหน้าบิล</button>`);
 const upd=()=>{const c=calc(t,endT(t));$('ed').textContent=Math.floor(c.ms/M)+' นาที';$('ea').textContent=c.a+' ฿';$('ew').textContent=c.ms>432e5?'เล่นนานกว่า 12 ชม. ตรวจสอบเวลาอีกครั้ง':''};
 ['we_h','we_m'].forEach(k=>wInit(k,'e',upd));upd()}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=c&0x8000?((c<<1)^0x1021):(c<<1);c&=0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
const tlv=(t,v)=>t+String(v.length).padStart(2,'0')+v;
function ppPayload(id,amt){const d=String(id).replace(/\D/g,'');let tag,v;
 if(d.length===10&&d[0]==='0'){tag='01';v='0066'+d.slice(1)}else if(d.length===9){tag='01';v='0066'+d}else if(d.length===11&&d.startsWith('66')){tag='01';v='00'+d}else if(d.length===13&&d.startsWith('0066')){tag='01';v=d}else if(d.length===13){tag='02';v=d}else if(d.length===15){tag='03';v=d}else return null;

function authView(msg){const m=authMode,btn=(f,t)=>`<button class="b p w" style="width:100%;margin-top:14px" onclick="${f}">${t}</button>`;
 const f={in:`<label>อีเมล</label><input id="g_e" type="email" autocomplete="username"><label>รหัสผ่าน</label><input id="g_p" type="password" autocomplete="current-password">${btn('doLogin()','เข้าสู่ระบบ')}<p class="lnk"><a onclick="am('up')">สมัครสมาชิก</a> · <a onclick="am('forgot')">ลืมรหัสผ่าน</a></p>`,
 up:`<label>ชื่อ (บังคับ)</label><input id="g_n"><label>รูปโปรไฟล์ (ไม่บังคับ)</label><div class="prow"><span id="g_pv">${av(null,'?',64)}</span><input type="file" accept="image/*" onchange="pickPhoto(this,'g_pv')"></div><label>อีเมล</label><input id="g_e" type="email" autocomplete="username"><label>รหัสผ่าน (อย่างน้อย 6 ตัว)</label><input id="g_p" type="password" autocomplete="new-password">${btn('doSignup()','สมัครสมาชิก')}<p class="lnk"><a onclick="am('in')">มีบัญชีแล้ว เข้าสู่ระบบ</a></p>`,
 forgot:`<label>อีเมลที่สมัครไว้</label><input id="g_e" type="email">${btn('doForgot()','ส่งลิงก์รีเซ็ตรหัสผ่าน')}<p class="lnk"><a onclick="am('in')">กลับไปเข้าสู่ระบบ</a></p>`,
 reset:`<label>รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</label><input id="g_p" type="password" autocomplete="new-password">${btn('doReset()','ตั้งรหัสผ่านใหม่')}`}[m];
 gate([{in:'เข้าสู่ระบบ',up:'สมัครสมาชิก',forgot:'ลืมรหัสผ่าน',reset:'ตั้งรหัสผ่านใหม่'}[m],f+`<p class="hint" id="g_m">${esc(msg||'')}</p>`])}
const am=m=>{authMode=m;pickB=null;authView()};
const login=msg=>{authMode='in';authView(msg)};
const home=()=>location.href.split('#')[0];
async function doLogin(){const r=await db.auth.signInWithPassword({email:$('g_e').value.trim(),password:$('g_p').value});if(r.error)return gm(r.error.message);boot()}
async function doSignup(){const n=$('g_n').value.trim(),e=$('g_e').value.trim(),p=$('g_p').value;
 if(!n)return gm('กรุณาใส่ชื่อ');if(!e||p.length<6)return gm('ใส่อีเมล และรหัสผ่านอย่างน้อย 6 ตัว');
 const r=await db.auth.signUp({email:e,password:p,options:{data:{name:n},emailRedirectTo:home()}});if(r.error)return gm(r.error.message);
 if(pickB){try{localStorage.setItem('lsc_pa',JSON.stringify({e:e.toLowerCase(),d:await b64(pickB)}))}catch(x){}}
 if(r.data.session)return boot();
 login('สมัครสำเร็จ ส่งอีเมลยืนยันไปที่ '+e+' แล้ว กดลิงก์ในอีเมล แล้วกลับมาเข้าสู่ระบบ')}
async function doForgot(){const e=$('g_e').value.trim();if(!e)return gm('ใส่อีเมล');const r=await db.auth.resetPasswordForEmail(e,{redirectTo:home()});if(r.error)return gm(r.error.message);gm('ส่งลิงก์รีเซ็ตไปที่อีเมลแล้ว (ตรวจในกล่องจดหมายขยะด้วย)')}
async function doReset(){const p=$('g_p').value;if(p.length<6)return gm('รหัสผ่านอย่างน้อย 6 ตัว');const r=await db.auth.updateUser({password:p});if(r.error)return gm(r.error.message);recovering=false;boot()}
async function out(){await db.auth.signOut();ME=null;T=[];hist=[];clearInterval(poll);if(sub){db.removeChannel(sub);sub=null}draw();login()}
async function upAvatar(blob){const path=ME.user_id+'/avatar.jpg',r=await db.storage.from('avatars').upload(path,blob,{upsert:true,contentType:'image/jpeg'});if(r.error)throw r.error;return db.storage.from('avatars').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}
async function pendAvatar(){try{const j=JSON.parse(localStorage.getItem('lsc_pa')||'null');if(!j||j.e!==(ME.email||'').toLowerCase())return;const u=await upAvatar(await (await fetch(j.d)).blob());await db.rpc('update_my_profile',{p_name:ME.name,p_avatar:u});ME.avatar_url=u;localStorage.removeItem('lsc_pa')}catch(e){}}
async function boot(){const c=cfg();if(!c.url||!c.key)return setup();
 if(!db){db=supabase.createClient(c.url,c.key);db.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;authMode='reset';authView()}})}
 const {data:{session}}=await db.auth.getSession();if(recovering)return;if(!session)return login();
 const pr=await db.from('profiles').select('*').eq('user_id',session.user.id).maybeSingle();
 if(!pr.data)return login('ไม่พบข้อมูลโปรไฟล์ กรุณาติดต่อ admin');
 ME={...pr.data,email:session.user.email};await pendAvatar();
 document.querySelector('nav button[data-v="2"]').style.display=adm()?'':'none';
 gate(null);await load();clearInterval(poll);
 if(adm()){if(!sub)sub=db.channel('lsc').on('postgres_changes',{event:'*',schema:'public'},()=>load()).subscribe()}else poll=setInterval(load,10000)}
function sets(){pickB=null;$('v3').innerHTML='<div id="v3p"></div>'+(adm()?'<div id="v3a"></div><div id="v3m"></div>':'');prof();if(adm()){setsA();members()}}
function prof(){$('v3p').innerHTML=`<div class="card"><div class="row"><span class="nm">โปรไฟล์</span><span class="chip ${adm()?'playing':'free'}">${adm()?'admin':'ผู้ดู'}</span></div><div class="prow" style="margin:12px 0"><span id="pf_pv">${av(ME.avatar_url,ME.name,72)}</span><div><label style="margin:0 0 4px">รูปโปรไฟล์ (เลือกรูปไหนก็ได้ ระบบย่อให้เอง)</label><input type="file" accept="image/*" onchange="pickPhoto(this,'pf_pv')"></div></div><label>ชื่อ</label><input id="pf_n"><p class="hint">${esc(ME.email||'')}</p><div class="btns" style="margin-top:12px"><button class="b" onclick="out()">ออกจากระบบ</button><button class="b p" onclick="saveProf()">บันทึกโปรไฟล์</button></div><p class="hint" id="pf_m"></p></div>`;$('pf_n').value=ME.name}
async function saveProf(){const n=$('pf_n').value.trim();if(!n)return $('pf_m').textContent='กรุณาใส่ชื่อ';try{let u=null;if(pickB)u=await upAvatar(pickB);const r=await db.rpc('update_my_profile',{p_name:n,p_avatar:u});if(r.error)throw r.error;ME.name=n;if(u)ME.avatar_url=u;pickB=null;prof();$('pf_m').textContent='บันทึกแล้ว ✓'}catch(e){$('pf_m').textContent=e.message}}
async function members(){const r=await db.from('profiles').select('*').order('created_at');if(r.error)return;$('v3m').innerHTML=`<div class="card"><div class="nm">สมาชิก (${r.data.length})</div>${r.data.map(u=>`<div class="mem">${av(u.avatar_url,u.name,40)}<div class="mi"><b>${esc(u.name)}</b><small>${esc(u.email||'')}</small></div><select onchange="setRole('${u.user_id}',this.value)"${u.user_id===ME.user_id?' disabled':''}><option value="viewer"${u.role==='viewer'?' selected':''}>ผู้ดู</option><option value="admin"${u.role==='admin'?' selected':''}>admin</option></select></div>`).join('')}</div>`}
async function setRole(id,r){if(ck(await db.rpc('set_role',{p_user:id,p_role:r})))members()}

async function load(){if(!adm()){const b=await db.rpc('board');T=(b.data||[]).map(x=>x.status?{id:x.table_id,st:x.status,s:Date.parse(x.started_at),r:x.rate_code,p:0,e:x.ended_at?Date.parse(x.ended_at):null}:{id:x.table_id,st:'free'});hist=[];draw();return}const d0=new Date();d0.setHours(0,0,0,0);
 const [a,b,c,h]=await Promise.all([db.from('settings').select('*').eq('id',1).single(),db.from('pool_tables').select('*').order('id'),db.from('sessions').select('*').in('status',['playing','billing']),db.from('sessions').select('*').eq('status','closed').gte('paid_at',d0.toISOString()).order('paid_at',{ascending:false})]);
 if(a.data){const x=a.data;Object.assign(S,{shop:x.shop_name,rAc:+x.rate_ac,rNon:+x.rate_non,mode:x.round_mode,min:+x.min_charge,pp:x.promptpay,bank:x.bank_name,an:x.account_name,ac:x.account_no,pin:x.pin})}
 T=(b.data||[]).map(t=>{const s=(c.data||[]).find(z=>z.table_id===t.id);return s?{id:t.id,sid:s.id,st:s.status,s:Date.parse(s.started_at),r:s.rate_code,p:+s.rate_per_hour,e:s.ended_at?Date.parse(s.ended_at):null}:{id:t.id,st:'free'}});
 hist=(h.data||[]).map(x=>({tbl:x.table_id,tot:+x.total_amount,m:x.payment_method,mins:+x.minutes_billed,at:hm(Date.parse(x.paid_at))}));
 draw();if(view===2)summ();if(view===3&&!editing)setsA()}
async function go(i){let s=null;if(W.s){let d=pickT('ws',Date.now());if(d-Date.now()>432e5)d-=864e5;s=new Date(d).toISOString()}
 if(!ck(await db.rpc('start_session',{p_table:i,p_rate:sr,p_start:s})))return;ov.classList.remove('show');load()}
async function cx(i){const t=T[i-1];if(ck(await db.rpc('cancel_session',{p_id:t.sid})))load()}
async function cfm(i){const t=T[i-1],e=W.e?new Date(endT(t)).toISOString():null;if(!ck(await db.rpc('checkout_session',{p_id:t.sid,p_end:e})))return;await load();bill(i)}
async function pay(i){const t=T[i-1];if(!ck(await db.rpc('confirm_payment',{p_id:t.sid,p_method:method})))return;ov.classList.remove('show');load()}
async function sv(){const u={shop_name:$('f_shop').value,rate_ac:+$('f_ac').value||0,rate_non:+$('f_non').value||0,round_mode:$('f_mode').value,min_charge:+$('f_min').value||0,promptpay:$('f_pp').value.trim(),bank_name:$('f_bank').value,account_name:$('f_an').value,account_no:$('f_acc').value,pin:$('f_pin').value};
 if(!ck(await db.from('settings').update(u).eq('id',1)))return;unlocked=false;saved=true;editing=false;await load();sets()}
boot();
</script>
